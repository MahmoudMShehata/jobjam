spring.application.name=jobjam

# Local secrets such as ANTHROPIC_API_KEY can live in backend/.env (git-ignored, see .env.example).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/jobjam}
spring.datasource.username=${DB_USERNAME:jobjam}
spring.datasource.password=${DB_PASSWORD:jobjam}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8090}
# Let the UI show why a request failed (e.g. a page that could not be fetched).
spring.web.error.include-message=always

# AI extraction of job details from a posting URL, text or screenshots:
# "ollama" (free, local model) or "anthropic" (Claude API, needs ANTHROPIC_API_KEY).
jobjam.ai.provider=${AI_PROVIDER:ollama}

# Ollama (https://ollama.com): needs `ollama serve` running and the model pulled.
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3-vl:8b-instruct}
# Tokens of prompt plus reply the model keeps in memory; larger needs more RAM.
ollama.context-length=${OLLAMA_CONTEXT_LENGTH:16384}
# Local models are slow: a long posting or several screenshots can take minutes.
ollama.timeout=${OLLAMA_TIMEOUT:5m}

# Claude API
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}

# Job posting screenshots: the Claude API accepts images up to 5 MB each; Ollama has no lower limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
